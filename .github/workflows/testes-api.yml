# Integração contínua: arranca a Toolshop em Docker (a mesma do ambiente local),
# corre os três perfis de testes e publica os relatórios.
name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite correr à mão, no separador Actions

# Uma execução de cada vez por ramo: um push novo cancela a que estiver a correr.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Variáveis do docker-compose da Toolshop.
      SPRINT: sprint5
      DISABLE_LOGGING: 'true'

    steps:
      - name: Obter o projeto de testes
        uses: actions/checkout@v6

      - name: Obter a Toolshop (Practice Software Testing)
        uses: actions/checkout@v6
        with:
          repository: testsmith-io/practice-software-testing
          path: pst

      # As imagens do servidor web e do agendador da Toolshop só existem para ARM (linux/arm64),
      # e a máquina do GitHub é x86 (amd64): sem emulação, esses contentores não correm.
      - name: Ativar a emulação ARM (QEMU)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # O nome do projeto (-p pst) dá os nomes dos contentores (pst-laravel-api-1...),
      # os mesmos do ambiente local. A interface (angular-ui) não é precisa.
      - name: Arrancar a Toolshop (API, servidor web, agendador e base de dados)
        working-directory: pst
        run: docker compose -f docker-compose.prod.yml -p pst up -d laravel-api web cron mariadb

      - name: Arrancar o servidor de email de testes (MailCatcher)
        run: >
          docker run -d --name pst-mailcatcher --network pst_default --network-alias mailcatcher
          -p 1080:1080 dockage/mailcatcher:0.9.0

      - name: Esperar pela base de dados
        run: |
          for i in $(seq 1 60); do
            if docker exec pst-mariadb-1 mysqladmin ping -h localhost -u root -proot --silent; then exit 0; fi
            sleep 2
          done
          docker logs pst-mariadb-1
          exit 1

      - name: Instalar o Node.js (versão do .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar os tipos (TypeScript)
        run: npm run typecheck

      # Os testes dos próprios testes: as verificações e as funções de apoio, com dados
      # inventados. Correm em menos de um segundo, antes de a Toolshop ser precisa.
      - name: Testes unitários (verificações e funções de apoio)
        run: npm run test:unit

      - name: Repor os dados da Toolshop
        run: npm run db:reset

      - name: Esperar pela API
        run: |
          for i in $(seq 1 60); do
            codigo=$(curl -s -o /tmp/resposta.txt -w '%{http_code}' --max-time 5 http://localhost:8091/status || true)
            if [ "$codigo" = "200" ]; then echo "API pronta (tentativa $i)"; exit 0; fi
            echo "Tentativa $i: HTTP $codigo"
            sleep 2
          done
          set +e
          echo "::group::Última resposta da API"; cat /tmp/resposta.txt; echo; echo "::endgroup::"
          echo "::group::Contentores"; docker ps -a; echo "::endgroup::"
          echo "::group::Registo do servidor web"; docker logs pst-web-1 2>&1 | tail -50; echo "::endgroup::"
          echo "::group::Registo da API"; docker logs pst-laravel-api-1 2>&1 | tail -50; echo "::endgroup::"
          echo "::group::Registo do Laravel"; docker exec pst-laravel-api-1 sh -c 'tail -50 storage/logs/laravel.log' 2>&1; echo "::endgroup::"
          exit 1

      - name: Cenários normais
        run: npm test

      - name: Cenários lentos
        run: npm run test:lento

      # Os bugs conhecidos falham de propósito: correm para o relatório, sem pôr a pipeline a vermelho.
      - name: Bugs conhecidos (informativo)
        if: always()
        continue-on-error: true
        run: npm run test:bugs

      - name: Publicar os relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios
          path: resultados/
          if-no-files-found: warn

      # Página de entrada dos relatórios no GitHub Pages (só nos pushes para main).
      - name: Preparar a página dos relatórios
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > resultados/index.html <<'HTML'
          <!doctype html>
          <html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Relatórios: testes da API da Toolshop</title>
          <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;line-height:1.5;color:#1f2430}a{color:#2f5d8a}li{margin:8px 0}</style></head>
          <body>
          <h1>Relatórios: testes da API da Toolshop</h1>
          <p>Gerados pela última execução da integração contínua no ramo <code>main</code>.</p>
          <ul>
          <li><a href="relatorio.html">Cenários normais</a></li>
          <li><a href="lento.html">Cenários lentos</a> (stock e email, que esperam pelo processamento em segundo plano)</li>
          <li><a href="bugs.html">Bugs conhecidos</a>: cada cenário falha enquanto o bug existir</li>
          </ul>
          <p><a href="https://github.com/evangelistaaj/Projeto-toolshop-api">Repositório no GitHub</a></p>
          </body></html>
          HTML

      - name: Enviar os relatórios para o GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: resultados/

  # Publica os relatórios no GitHub Pages, mesmo quando há falhas (é quando mais interessam).
  publicar:
    needs: testes
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.testes.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
